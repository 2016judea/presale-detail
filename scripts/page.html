<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Detail Jobs</title>
<meta name="description" content="Cars and boats for sale near {{CITY}} that need a detail, biggest job first, with a message ready to send.">
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script>
<script defer src="/_vercel/insights/script.js"></script>
<script>/*READER_EVENTS*/</script>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#1d1b17;--mute:#6b665c;--line:#e2dccf;--accent:#0f5e6b;--accent-ink:#fff;--chip:#ebe5d8;--good:#2f7a3d}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--card:#1d1c19;--ink:#efebe2;--mute:#a7a194;--line:#33302a;--accent:#5fb3c0;--accent-ink:#0b1b1e;--chip:#2a2824;--good:#6cc27c}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:22px 16px 12px;max-width:1200px;margin:0 auto}
.who{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
h1{font-size:30px;line-height:1.1;margin:0 0 8px;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:16px;margin:0}
.sub b{color:var(--ink)}
nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
nav .in{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;gap:8px}
nav .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
nav button{font:inherit;font-size:15px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:44px}
nav button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tools{max-width:1200px;margin:0 auto;padding:0 16px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tools .row{display:flex;gap:6px}
.tools button{font:inherit;font-size:14px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:36px}
.tools button[aria-pressed=true]{background:var(--chip);border-color:var(--mute)}
header .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
header .top .who{margin:0}
.rates{font:inherit;font-size:14px;font-weight:600;padding:6px 14px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);cursor:pointer;min-height:36px;white-space:nowrap}
#rates{max-width:1200px;margin:0 auto;padding:0 16px}
#rates[hidden]{display:none}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.sheet h2{margin:0 0 4px}
.sheet p{margin:0 0 10px;color:var(--mute);font-size:14px}
.rate{display:grid;grid-template-columns:1fr 92px 76px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.rate.hd{border-top:0;font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.rate input{font:inherit;font-size:16px;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.sheet .reset{background:none;border:0;color:var(--accent);font:inherit;font-size:14px;padding:10px 0 0;cursor:pointer}
main{max-width:1200px;margin:0 auto;padding:14px 16px 40px;display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:760px){main{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1120px){main{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card.sent{opacity:.55}
.ph{position:relative;aspect-ratio:4/3;background:var(--chip)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.kind{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.92);color:#222;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.body{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.job{display:flex;gap:28px;align-items:flex-start}
.job div{display:flex;flex-direction:column}
.job small{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.job .pay{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.job .hrs{font-size:32px;font-weight:500;letter-spacing:-.02em;line-height:1.05;color:var(--mute)}
h2{font-size:17px;line-height:1.3;margin:0;overflow-wrap:anywhere}
.loc{color:var(--mute);font-size:14px;margin-top:-8px}
.src{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:5px;margin-right:6px;color:#fff;vertical-align:1px}
.src.craigslist{background:#5a3e85}.src.facebook{background:#1b64d8}
.fix small{display:block;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.saw{margin:0;padding-left:18px;font-size:15px}
.saw li{margin:2px 0}
.more{background:none;border:0;color:var(--accent);font:inherit;font-size:14px;padding:4px 0;cursor:pointer}
.msg{border-left:3px solid var(--accent);padding:2px 0 2px 12px;font-size:15px;white-space:pre-wrap}
.contact{font-size:14px;color:var(--mute)}
.contact b{color:var(--ink)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.acts .copy{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border:0;font-size:17px;min-height:52px}
.acts button,.acts a{font:inherit;font-size:15px;font-weight:600;text-align:center;text-decoration:none;padding:11px 10px;border-radius:12px;min-height:46px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.acts a,.acts .mark{border:1px solid var(--line);color:var(--ink);background:var(--card)}
.acts .mark[aria-pressed=true]{color:var(--good);border-color:var(--good)}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
footer{max-width:1200px;margin:0 auto;padding:0 16px 40px;color:var(--mute);font-size:13.5px}
</style>

<body>
<header>
  <div class="top"><p class="who">Zane &amp; Darren · Detail jobs</p><button class="rates" id="ratesBtn" aria-expanded="false">Your prices</button></div>
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>
</header>
<div class="tools"><span id="srcs" class="row"></span></div>
<section id="rates" hidden></section>
<nav><div class="in"><div class="row" id="kinds"></div></div></nav>
<main id="list"></main>
<footer id="foot"></footer>
<script>
const DATA=/*DATA*/null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"$"+Math.round(n).toLocaleString("en-US");
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(_){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
let mine=store.get("rates",{}), sent=store.get("sent",{}), kind="all", src="all";
const DEF=Object.fromEntries(DATA.meta.prices.map(p=>[p.tier,p]));
const rate=t=>({price:mine[t]?.price??DEF[t].price,hours:mine[t]?.hours??DEF[t].hours});
const r5=x=>Math.floor(x/5+.5)*5;
function price(c){let total=0,hours=0;
  for(const l of c.quote.lines){const r=rate(l.tier);total+=r5(r.price*l.qty);hours+=r.hours*l.qty}
  return{total,hours,message:c.msg_tpl.replace("{TOTAL}",money(total))}}
const hrs=h=>{const q=Math.round(h*2)/2;return q+(q===1?" hr":" hrs")};
function contact(c){
  if(c.source==="facebook")return`<div class="contact">Send it with <b>Message seller</b> on Facebook.</div>`;
  if(c.phones.length)return`<div class="contact">Text <b>${c.phones.map(esc).join(", ")}</b></div>`;
  if(c.contact_in_post)return`<div class="contact">Seller left a number: tap <b>show contact info</b> on the listing.</div>`;
  return`<div class="contact">Reply through the listing.</div>`}
function card(c,i){const p=c._p,saw=c.findings.slice(0,3),rest=c.findings.slice(3),isSent=!!sent[c.id];
  return`<article class="card${isSent?" sent":""}">
  <div class="ph">${c.photo?`<img referrerpolicy="no-referrer" loading="${i<3?"eager":"lazy"}" src="${esc(c.photo)}" alt="">`:""}<span class="kind">${c.kind}</span></div>
  <div class="body">
    <div class="job"><div><small>Job price</small><span class="pay">${money(p.total)}</span></div><div><small>Estimated hours</small><span class="hrs">${hrs(p.hours)}</span></div></div>
    <h2>${esc(c.title)}</h2>
    <div class="loc"><span class="src ${c.source}">${c.source==="facebook"?"Facebook":"Craigslist"}</span>${esc(c.location)}</div>
    <div class="fix"><small>What it needs</small><ul class="saw">${saw.map(f=>`<li>${esc(f)}</li>`).join("")}${rest.map(f=>`<li hidden>${esc(f)}</li>`).join("")}</ul>
    ${rest.length?`<button class="more" data-more>Show ${rest.length} more</button>`:""}</div>
    <div class="msg">${esc(p.message)}</div>
    ${contact(c)}
    <div class="acts"><button class="copy" data-copy="${c.id}">Copy message</button><a href="${esc(c.url)}" target="_blank" rel="noopener" data-open="${c.id}">${c.source==="facebook"?"Message seller":"Open listing"}</a><button class="mark" data-sent="${c.id}" aria-pressed="${isSent}">${isSent?"Sent ✓":"Mark sent"}</button></div>
  </div></article>`}
function render(){
  DATA.cards.forEach(c=>c._p=price(c));
  const all=DATA.cards, f=(k,s)=>all.filter(c=>(k==="all"||c.kind===k)&&(s==="all"||c.source===s));
  const cs=f(kind,src).sort((a,b)=>b._p.total-a._p.total||b.need-a.need||a.days_idle-b.days_idle);
  const open=cs.filter(c=>!sent[c.id]);
  $("#h1").textContent=`${money(open.reduce((a,c)=>a+c._p.total,0))} in detail jobs`;
  const fresh=open.filter(c=>c.new24).length, nSent=cs.length-open.length;
  $("#sub").innerHTML=`<b>${open.length}</b> people selling a ${kind==="all"?"car or boat":kind} near ${esc(DATA.meta.city.replace(/^./,m=>m.toUpperCase()))} need a detail${fresh?`, <b>${fresh}</b> listed today`:""}. Biggest job first.${nSent?` ${nSent} marked sent.`:""}`;
  $("#kinds").innerHTML=[["all","All"],["car","Cars"],["boat","Boats"]].map(([k,l])=>`<button data-kind="${k}" aria-pressed="${k===kind}">${l} ${f(k,src).length}</button>`).join("");
  $("#srcs").innerHTML=[["all","Both"],["craigslist","Craigslist"],["facebook","Facebook"]].map(([s,l])=>`<button data-src="${s}" aria-pressed="${s===src}">${l} ${f(kind,s).length}</button>`).join("");
  $("#list").innerHTML=cs.length?cs.map(card).join(""):`<p class="empty">Nothing here today. New listings come in daily.</p>`;
}
function sheet(){
  $("#rates").innerHTML=`<div class="sheet"><h2>Your prices</h2><p>What you charge and how long it takes you. Every job price on this page updates as you type. Saved on this phone.</p>
  <div class="rate hd"><span>Service</span><span>Price $</span><span>Hours</span></div>
  ${DATA.meta.prices.map(p=>{const r=rate(p.tier);return`<label class="rate"><span>${esc(p.label)}</span><input inputmode="decimal" data-t="${p.tier}" data-f="price" value="${r.price}"><input inputmode="decimal" data-t="${p.tier}" data-f="hours" value="${r.hours}"></label>`}).join("")}
  <button class="reset" data-reset>Reset to suggested prices</button></div>`}
document.addEventListener("input",e=>{const i=e.target.closest("[data-t]");if(!i)return;
  const v=parseFloat(i.value);if(!(v>=0))return;(mine[i.dataset.t]??={})[i.dataset.f]=v;store.set("rates",mine);render()});
document.addEventListener("click",e=>{
  if(e.target.closest("#ratesBtn")){const r=$("#rates"),b=$("#ratesBtn");r.hidden=!r.hidden;b.setAttribute("aria-expanded",!r.hidden);if(!r.hidden){sheet();va("event",{name:"open_prices"})}return}
  if(e.target.closest("[data-reset]")){mine={};store.set("rates",mine);sheet();render();return}
  const f=e.target.closest("button[data-kind],button[data-src]");
  if(f){if(f.dataset.kind)kind=f.dataset.kind;if(f.dataset.src)src=f.dataset.src;render();window.scrollTo({top:0});return}
  const cp=e.target.closest("[data-copy]");
  if(cp){const c=DATA.cards.find(x=>x.id===cp.dataset.copy),text=c._p.message;
    const done=()=>{cp.textContent="Copied";setTimeout(()=>cp.textContent="Copy message",1600)};
    (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(done,()=>{
      const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();done()});
    va("event",{name:"copy",data:{id:c.id,kind:c.kind}});
    try{window.posthog&&posthog.capture&&posthog.capture("copy",{id:c.id,kind:c.kind,source:c.source})}catch(_){}
    return}
  const sd=e.target.closest("[data-sent]");
  if(sd){const id=sd.dataset.sent;if(sent[id])delete sent[id];else sent[id]=Date.now();store.set("sent",sent);render();va("event",{name:"mark_sent"});return}
  const op=e.target.closest("[data-open]");
  if(op){va("event",{name:"open_listing",data:{id:op.dataset.open}});return}
  const m=e.target.closest("[data-more]");
  if(m){m.previousElementSibling.querySelectorAll("li[hidden]").forEach(li=>li.hidden=false);m.remove()}
});
const t=new Date(DATA.meta.fetched_at);
$("#foot").innerHTML=`Updated ${t.toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}. Job prices start from a competitive US rate; set your own under <b>Your prices</b>. Nothing is sent for you.`;
render();
</script>
</body>
</html>
